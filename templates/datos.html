{% extends "base.html" %}
{% from "_macros.html" import pasos %}
{% block titulo %}Datos generales{% endblock %}
{% block contenido %}
<section class="tarjeta flujo">
  <h1>Edad y género</h1>
  <p class="intro"><strong>Lo que tienes que hacer:</strong> indicar tu edad y tu género.</p>
  {{ pasos(2) }}

  <form method="POST" action="{{ url_for('iniciar_test') }}" class="formulario-flujo" data-cargando="Preparando el test…" data-cargando-sub="">
    <div class="fila-2">
    <div class="form-group">
      <label for="edad">Edad</label>
      <input type="number" id="edad" name="edad" min="5" max="110" inputmode="numeric" placeholder="Ej.: 27" required aria-describedby="ayuda-edad" autofocus>
      <p class="ayuda" id="ayuda-edad">En años cumplidos.</p>
    </div>
    <div class="form-group">
      <label for="genero">Género</label>
      <select id="genero" name="genero" required aria-describedby="ayuda-genero">
        <option value="" disabled selected>Selecciona tu género</option>
        <option value="Femenino">Femenino</option>
        <option value="Masculino">Masculino</option>
        <option value="Otro">Otro / prefiero no decirlo</option>
      </select>
      <p class="ayuda" id="ayuda-genero">Solo adapta algunas frases (niño o niña).</p>
    </div>
    </div>
    <input type="submit" value="Empezar el test →">
  </form>
</section>
{% endblock %}
